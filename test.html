<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bean Character Tester</title>
    <!-- Tailwind CSS for clean UI overlays -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: #38a169;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }
    </style>
</head>
<body class="bg-emerald-600 flex flex-col h-screen w-screen overflow-hidden text-slate-800">

    <!-- Debug HUD Overlay -->
    <div class="absolute top-3 left-3 z-10 bg-slate-900/80 backdrop-blur-md text-white text-xs md:text-sm font-mono p-3 rounded-xl shadow-lg border border-white/10 flex flex-col gap-1 w-48 sm:w-56 pointer-events-none">
        <div class="flex justify-between items-center border-b border-slate-700/60 pb-1 mb-1 font-bold text-emerald-400">
            <span>BEAN TESTER</span>
            <span id="fps-counter" class="text-xs text-slate-400">60 FPS</span>
        </div>
        <div class="flex justify-between">
            <span class="text-slate-400">Pos X:</span>
            <span id="pos-x" class="font-bold text-emerald-300">0</span>
        </div>
        <div class="flex justify-between">
            <span class="text-slate-400">Pos Y:</span>
            <span id="pos-y" class="font-bold text-emerald-300">0</span>
        </div>
        <div class="flex justify-between">
            <span class="text-slate-400">State:</span>
            <span id="state-text" class="font-bold text-amber-300">IDLE</span>
        </div>
        <div class="flex justify-between">
            <span class="text-slate-400">Speed Multiplier:</span>
            <span id="speed-text" class="font-bold text-cyan-300">1x</span>
        </div>
    </div>

    <!-- Toolbar / Control Buttons -->
    <div class="absolute top-3 right-3 z-10 flex gap-2">
        <button id="btn-speed" class="bg-slate-900/80 hover:bg-slate-800 text-white font-medium text-xs md:text-sm px-3 py-2 rounded-xl backdrop-blur-md border border-white/10 shadow-lg active:scale-95 transition flex items-center gap-1.5 cursor-pointer">
            <svg class="w-4 h-4 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="T13 10V3L4 14h7v7l9-11h-7z"></path></svg>
            <span id="btn-speed-label">Speed: 1x</span>
        </button>
        <button id="btn-reset" class="bg-slate-900/80 hover:bg-slate-800 text-white font-medium text-xs md:text-sm px-3 py-2 rounded-xl backdrop-blur-md border border-white/10 shadow-lg active:scale-95 transition flex items-center gap-1.5 cursor-pointer">
            <svg class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
            <span>Reset Pos</span>
        </button>
        <button id="btn-grid" class="bg-slate-900/80 hover:bg-slate-800 text-white font-medium text-xs md:text-sm px-3 py-2 rounded-xl backdrop-blur-md border border-white/10 shadow-lg active:scale-95 transition flex items-center gap-1.5 cursor-pointer">
            <svg class="w-4 h-4 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"></path></svg>
            <span id="btn-grid-label">Grid: ON</span>
        </button>
    </div>

    <!-- Onscreen D-Pad Controls for Mobile Testing -->
    <div class="absolute bottom-6 left-6 z-10 md:hidden grid grid-cols-3 gap-1 w-36 h-36 opacity-80 touch-none">
        <div></div>
        <button id="dpad-up" class="bg-slate-900/60 active:bg-slate-800 text-white rounded-t-xl flex items-center justify-center font-bold text-lg select-none">▲</button>
        <div></div>
        <button id="dpad-left" class="bg-slate-900/60 active:bg-slate-800 text-white rounded-l-xl flex items-center justify-center font-bold text-lg select-none">◀</button>
        <div class="bg-slate-900/30 rounded-lg"></div>
        <button id="dpad-right" class="bg-slate-900/60 active:bg-slate-800 text-white rounded-r-xl flex items-center justify-center font-bold text-lg select-none">▶</button>
        <div></div>
        <button id="dpad-down" class="bg-slate-900/60 active:bg-slate-800 text-white rounded-b-xl flex items-center justify-center font-bold text-lg select-none">▼</button>
        <div></div>
    </div>

    <!-- Instructions Overlay Hint -->
    <div class="absolute bottom-4 right-4 z-10 text-white/70 text-xs font-mono bg-slate-900/50 backdrop-blur-sm px-3 py-1.5 rounded-lg border border-white/5 pointer-events-none hidden sm:block">
        Controls: <span class="text-white font-semibold">WASD</span> or <span class="text-white font-semibold">Arrow Keys</span>
    </div>

    <!-- Main Game Canvas -->
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // UI Elements
        const fpsEl = document.getElementById('fps-counter');
        const posXEl = document.getElementById('pos-x');
        const posYEl = document.getElementById('pos-y');
        const stateEl = document.getElementById('state-text');
        const speedTextEl = document.getElementById('speed-text');
        const btnSpeedLabel = document.getElementById('btn-speed-label');
        const btnGridLabel = document.getElementById('btn-grid-label');

        // World & Display Settings
        let viewportWidth = 0;
        let viewportHeight = 0;
        let showGrid = true;

        // Player State
        const player = {
            x: 0,
            y: 0,
            vx: 0,
            vy: 0,
            baseSpeed: 3.5,
            speedMultipliers: [1, 2, 3],
            speedIndex: 0,
            width: 28,
            height: 42,
            angle: 0,
            wobble: 0,
            isMoving: false,
            facingAngle: 0
        };

        // Dust Particle System
        const particles = [];

        // Performance & Timing Tracking
        let lastTime = performance.now();
        let frameCount = 0;
        let fps = 60;
        let fpsTimer = performance.now();

        // Key State Tracking
        const keys = {
            Up: false,
            Down: false,
            Left: false,
            Right: false
        };

        // Canvas Sizing and Window Resize Listener
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            viewportWidth = canvas.width;
            viewportHeight = canvas.height;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Center player initially
        player.x = viewportWidth / 2;
        player.y = viewportHeight / 2;

        // Key Listeners
        window.addEventListener('keydown', (e) => {
            handleKey(e.code, true);
        });

        window.addEventListener('keyup', (e) => {
            handleKey(e.code, false);
        });

        function handleKey(code, isPressed) {
            switch (code) {
                case 'KeyW':
                case 'ArrowUp':
                    keys.Up = isPressed;
                    break;
                case 'KeyS':
                case 'ArrowDown':
                    keys.Down = isPressed;
                    break;
                case 'KeyA':
                case 'ArrowLeft':
                    keys.Left = isPressed;
                    break;
                case 'KeyD':
                case 'ArrowRight':
                    keys.Right = isPressed;
                    break;
            }
        }

        // Mobile D-Pad Events
        const dpadMap = [
            { id: 'dpad-up', key: 'Up' },
            { id: 'dpad-down', key: 'Down' },
            { id: 'dpad-left', key: 'Left' },
            { id: 'dpad-right', key: 'Right' }
        ];

        dpadMap.forEach(({ id, key }) => {
            const el = document.getElementById(id);
            if (!el) return;
            
            const startPress = (e) => {
                e.preventDefault();
                keys[key] = true;
            };
            const endPress = (e) => {
                e.preventDefault();
                keys[key] = false;
            };

            el.addEventListener('touchstart', startPress);
            el.addEventListener('touchend', endPress);
            el.addEventListener('mousedown', startPress);
            el.addEventListener('mouseup', endPress);
            el.addEventListener('mouseleave', endPress);
        });

        // Debug Toolbar Button Listeners
        document.getElementById('btn-reset').addEventListener('click', () => {
            player.x = viewportWidth / 2;
            player.y = viewportHeight / 2;
            player.vx = 0;
            player.vy = 0;
        });

        document.getElementById('btn-speed').addEventListener('click', () => {
            player.speedIndex = (player.speedIndex + 1) % player.speedMultipliers.length;
            const mult = player.speedMultipliers[player.speedIndex];
            speedTextEl.textContent = `${mult}x`;
            btnSpeedLabel.textContent = `Speed: ${mult}x`;
        });

        document.getElementById('btn-grid').addEventListener('click', () => {
            showGrid = !showGrid;
            btnGridLabel.textContent = `Grid: ${showGrid ? 'ON' : 'OFF'}`;
        });

        // Static procedural grass tufts generation
        const grassTufts = [];
        const numTufts = 350;
        
        function generateGrassTufts() {
            grassTufts.length = 0;
            // Spread grass tufts across a virtual area larger than screen
            const fieldWidth = Math.max(2500, window.innerWidth * 2);
            const fieldHeight = Math.max(2500, window.innerHeight * 2);

            for (let i = 0; i < numTufts; i++) {
                grassTufts.push({
                    x: Math.random() * fieldWidth,
                    y: Math.random() * fieldHeight,
                    size: 3 + Math.random() * 4,
                    color: Math.random() > 0.5 ? '#38a169' : '#2f855a'
                });
            }
        }
        generateGrassTufts();

        function updatePlayer(dt) {
            // Determine movement vector
            let dx = 0;
            let dy = 0;

            if (keys.Up) dy -= 1;
            if (keys.Down) dy += 1;
            if (keys.Left) dx -= 1;
            if (keys.Right) dx += 1;

            // Normalize diagonal movement
            if (dx !== 0 && dy !== 0) {
                dx *= 0.7071;
                dy *= 0.7071;
            }

            const currentSpeed = player.baseSpeed * player.speedMultipliers[player.speedIndex];

            if (dx !== 0 || dy !== 0) {
                player.isMoving = true;
                player.vx = dx * currentSpeed;
                player.vy = dy * currentSpeed;
                player.facingAngle = Math.atan2(dy, dx);
                
                // Advance wobble animation for bean walk
                player.wobble += 0.25 * (player.speedMultipliers[player.speedIndex] * 0.8 + 0.2);

                // Spawn tiny dust particles when running
                if (Math.random() < 0.35) {
                    particles.push({
                        x: player.x - Math.cos(player.facingAngle) * 10 + (Math.random() * 6 - 3),
                        y: player.y - Math.sin(player.facingAngle) * 10 + (Math.random() * 6 - 3),
                        vx: -dx * 0.5 + (Math.random() * 0.4 - 0.2),
                        vy: -dy * 0.5 + (Math.random() * 0.4 - 0.2),
                        radius: 2 + Math.random() * 2,
                        alpha: 0.5,
                        life: 1.0
                    });
                }
            } else {
                player.isMoving = false;
                player.vx *= 0.8; // Smooth deceleration
                player.vy *= 0.8;
                if (Math.abs(player.vx) < 0.01) player.vx = 0;
                if (Math.abs(player.vy) < 0.01) player.vy = 0;
                player.wobble = Math.sin(performance.now() * 0.003) * 0.1; // Gentle breathing pulse when idle
            }

            // Update positions
            player.x += player.vx;
            player.y += player.vy;

            // Clamp bounds to visible screen with padding
            const pad = 20;
            player.x = Math.max(pad, Math.min(viewportWidth - pad, player.x));
            player.y = Math.max(pad, Math.min(viewportHeight - pad, player.y));

            // Update particles
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= 0.03;
                if (p.alpha <= 0) {
                    particles.splice(i, 1);
                }
            }
        }

        function drawGrassPlane() {
            // Base flat grass green fill
            ctx.fillStyle = '#48bb78';
            ctx.fillRect(0, 0, viewportWidth, viewportHeight);

            // Optional subtle tile grid for motion testing
            if (showGrid) {
                const gridSize = 64;
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.07)';
                ctx.lineWidth = 1;

                ctx.beginPath();
                for (let x = 0; x < viewportWidth; x += gridSize) {
                    ctx.moveTo(x, 0);
                    ctx.lineTo(x, viewportHeight);
                }
                for (let y = 0; y < viewportHeight; y += gridSize) {
                    ctx.moveTo(0, y);
                    ctx.lineTo(viewportWidth, y);
                }
                ctx.stroke();
            }

            // Draw decorative grass blades / tufts
            for (let i = 0; i < grassTufts.length; i++) {
                const tuft = grassTufts[i];
                // Only render tufts visible on screen
                if (tuft.x >= 0 && tuft.x <= viewportWidth && tuft.y >= 0 && tuft.y <= viewportHeight) {
                    ctx.fillStyle = tuft.color;
                    ctx.beginPath();
                    // Draw tiny blade triad
                    ctx.fillRect(tuft.x, tuft.y, 2, tuft.size);
                    ctx.fillRect(tuft.x - 2, tuft.y + 2, 2, tuft.size - 1);
                    ctx.fillRect(tuft.x + 2, tuft.y + 1, 2, tuft.size - 2);
                }
            }
        }

        function drawParticles() {
            for (let i = 0; i < particles.length; i++) {
                const p = particles[i];
                ctx.fillStyle = `rgba(226, 232, 240, ${p.alpha})`;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function drawBeanCharacter() {
            ctx.save();
            ctx.translate(player.x, player.y);

            // Calculate squash and stretch scales based on walk wobble animation
            let scaleX = 1 + Math.sin(player.wobble) * 0.12;
            let scaleY = 1 - Math.sin(player.wobble) * 0.12;

            if (!player.isMoving) {
                // Subtle idle breathing stretch
                scaleX = 1 + Math.sin(player.wobble) * 0.03;
                scaleY = 1 - Math.sin(player.wobble) * 0.03;
            }

            // 1. Drop Shadow underneath
            ctx.beginPath();
            ctx.ellipse(0, player.height / 2 - 2, (player.width / 2) * scaleX * 1.1, 7 * scaleY, 0, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(15, 23, 42, 0.2)';
            ctx.fill();

            // Apply squash/stretch scaling for character body
            ctx.scale(scaleX, scaleY);

            // Slight tilt towards direction of movement
            let tiltAngle = 0;
            if (player.isMoving) {
                tiltAngle = Math.cos(player.wobble) * 0.15;
            }
            ctx.rotate(tiltAngle);

            // 2. Main Bean Body (Rounded Pill Shape / Capsule)
            const w = player.width;
            const h = player.height;
            const r = w / 2;

            ctx.beginPath();
            ctx.roundRect(-w / 2, -h / 2, w, h, r);
            
            // Bright white fill with very light shading gradient
            const beanGradient = ctx.createLinearGradient(0, -h / 2, 0, h / 2);
            beanGradient.addColorStop(0, '#FFFFFF');
            beanGradient.addColorStop(0.85, '#F1F5F9');
            beanGradient.addColorStop(1, '#E2E8F0');
            ctx.fillStyle = beanGradient;
            ctx.fill();

            // Crisp subtle outline
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#CBD5E1';
            ctx.stroke();

            // 3. Cute Tiny Black Eyes
            let eyeOffsetX = 0;
            let eyeOffsetY = -2;

            // Shift eyes slightly based on facing direction
            if (player.isMoving) {
                eyeOffsetX = Math.cos(player.facingAngle) * 4;
                eyeOffsetY += Math.sin(player.facingAngle) * 3;
            }

            ctx.fillStyle = '#0F172A'; // Dark slate eyes
            const eyeRadius = 2.5;
            const eyeSpacing = 6;

            // Left Eye
            ctx.beginPath();
            ctx.arc(-eyeSpacing + eyeOffsetX, eyeOffsetY, eyeRadius, 0, Math.PI * 2);
            ctx.fill();

            // Right Eye
            ctx.beginPath();
            ctx.arc(eyeSpacing + eyeOffsetX, eyeOffsetY, eyeRadius, 0, Math.PI * 2);
            ctx.fill();

            // Tiny catchlight highlights inside eyes
            ctx.fillStyle = '#FFFFFF';
            ctx.beginPath();
            ctx.arc(-eyeSpacing + eyeOffsetX - 0.8, eyeOffsetY - 0.8, 0.8, 0, Math.PI * 2);
            ctx.arc(eyeSpacing + eyeOffsetX - 0.8, eyeOffsetY - 0.8, 0.8, 0, Math.PI * 2);
            ctx.fill();

            // Cute Pink Cheek Blush
            ctx.fillStyle = 'rgba(251, 113, 133, 0.45)';
            ctx.beginPath();
            ctx.arc(-eyeSpacing - 3 + eyeOffsetX, eyeOffsetY + 4, 2.5, 0, Math.PI * 2);
            ctx.arc(eyeSpacing + 3 + eyeOffsetX, eyeOffsetY + 4, 2.5, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }

        function updateHUD() {
            posXEl.textContent = Math.round(player.x);
            posYEl.textContent = Math.round(player.y);
            
            if (player.isMoving) {
                stateEl.textContent = "MOVING";
                stateEl.className = "font-bold text-emerald-400";
            } else {
                stateEl.textContent = "IDLE";
                stateEl.className = "font-bold text-amber-300";
            }
        }

        function gameLoop(now) {
            const dt = (now - lastTime) / 1000;
            lastTime = now;

            // Calculate FPS every 250ms
            frameCount++;
            if (now - fpsTimer >= 250) {
                fps = Math.round((frameCount * 1000) / (now - fpsTimer));
                fpsEl.textContent = `${fps} FPS`;
                frameCount = 0;
                fpsTimer = now;
            }

            // Update game physics & state
            updatePlayer(dt);
            updateHUD();

            // Render scene
            ctx.clearRect(0, 0, viewportWidth, viewportHeight);
            drawGrassPlane();
            drawParticles();
            drawBeanCharacter();

            requestAnimationFrame(gameLoop);
        }

        // Start animation loop on load
        window.onload = function() {
            requestAnimationFrame((now) => {
                lastTime = now;
                fpsTimer = now;
                gameLoop(now);
            });
        };
    </script>
</body>
</html>
