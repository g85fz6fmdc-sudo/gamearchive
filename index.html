<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>New Tab</title>
    <link rel="icon" type="image/png" href="logo.png">
    <style>
        :root {
            --bg-color: #0f172a;
            --text-color: #f8fafc;
            --accent-color: #38bdf8;
            --card-bg: #1e293b;
            --btn-bg: #22c55e;
            --btn-text: #ffffff;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { height: 100%; margin: 0; }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: calc(20px + env(safe-area-inset-top, 0px)) calc(20px + env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) calc(20px + env(safe-area-inset-left, 0px));
            overflow-x: hidden;
        }
        /* soft colored glow behind the glass card, same look as the site */
        #orbs {
            position: fixed;
            inset: -10%;
            z-index: -1;
            pointer-events: none;
            background:
                radial-gradient(40vmax 40vmax at 15% 20%, rgba(120, 120, 255, 0.45), transparent 70%),
                radial-gradient(45vmax 45vmax at 85% 35%, rgba(255, 120, 200, 0.30), transparent 70%),
                radial-gradient(50vmax 50vmax at 40% 95%, rgba(80, 200, 255, 0.30), transparent 70%);
            background:
                radial-gradient(40vmax 40vmax at 15% 20%, color-mix(in srgb, var(--accent-color) 55%, transparent), transparent 70%),
                radial-gradient(45vmax 45vmax at 85% 35%, color-mix(in srgb, var(--btn-bg) 40%, transparent), transparent 70%),
                radial-gradient(50vmax 50vmax at 40% 95%, color-mix(in srgb, var(--accent-color) 35%, transparent), transparent 70%);
            animation: drift 26s ease-in-out infinite alternate;
        }
        @keyframes drift {
            from { transform: translate(-2%, -1%) scale(1); }
            to { transform: translate(2%, 2%) scale(1.08); }
        }
        @media (prefers-reduced-motion: reduce) { #orbs { animation: none; } }

        #menu {
            width: 100%;
            max-width: 420px;
            padding: 28px 22px 22px;
            text-align: center;
            background-color: rgba(255, 255, 255, 0.10);
            background-color: color-mix(in srgb, var(--card-bg) 45%, transparent);
            background-image: linear-gradient(160deg, rgba(255, 255, 255, 0.18), rgba(255, 255, 255, 0.02) 45%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            backdrop-filter: blur(24px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 28px;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.55), inset 0 -1px 0 rgba(255, 255, 255, 0.10), 0 20px 50px -10px rgba(0, 0, 0, 0.5);
        }
        #menu[hidden] { display: none; }
        h1 { margin: 0 0 6px; font-size: 1.9rem; font-weight: 800; color: var(--accent-color); }
        .sub { margin: 0 0 22px; font-size: 0.95rem; opacity: 0.8; }

        .btn {
            display: block;
            width: 100%;
            min-height: 52px;
            padding: 14px 16px;
            margin-bottom: 12px;
            font: inherit;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 9999px;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.28);
            color: var(--text-color);
            background-color: rgba(255, 255, 255, 0.12);
            background-image: linear-gradient(180deg, rgba(255, 255, 255, 0.22), rgba(255, 255, 255, 0) 60%);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.45), 0 6px 16px rgba(0, 0, 0, 0.25);
            transition: transform 0.15s ease, filter 0.15s ease;
        }
        .btn.primary {
            color: var(--btn-text);
            background-color: rgba(34, 197, 94, 0.85);
            background-color: color-mix(in srgb, var(--btn-bg) 82%, transparent);
            background-image: linear-gradient(180deg, rgba(255, 255, 255, 0.40), rgba(255, 255, 255, 0) 60%);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.6), inset 0 -1px 0 rgba(0, 0, 0, 0.12), 0 6px 16px rgba(0, 0, 0, 0.3);
        }
        .btn:hover { filter: brightness(1.12); }
        .btn:active { transform: scale(0.98); }
        .btn:focus-visible, .remember:focus-within { outline: 2px solid var(--accent-color); outline-offset: 3px; }

        .remember {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin: 8px auto 0;
            padding: 8px 10px;
            font-size: 0.95rem;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            border-radius: 12px;
            width: fit-content;
        }
        .remember input { width: 20px; height: 20px; margin: 0; accent-color: var(--accent-color); cursor: pointer; }
        .hint { margin: 10px 0 0; font-size: 0.78rem; line-height: 1.4; opacity: 0.6; }
        #notice {
            margin: 0 0 14px;
            padding: 10px 12px;
            font-size: 0.85rem;
            line-height: 1.4;
            border-radius: 14px;
            background: rgba(245, 158, 11, 0.18);
            border: 1px solid rgba(245, 158, 11, 0.55);
        }
        #notice[hidden] { display: none; }
        noscript a { display: block; margin: 12px 0; color: var(--accent-color); font-weight: 700; }
    </style>
</head>
<body>
    <div id="orbs"></div>

    <main id="menu" hidden>
        <h1>Game Hub</h1>
        <p class="sub">How do you want to open the site?</p>

        <p id="notice" hidden></p>

        <button id="btn-cloak" class="btn primary" type="button">Open with cloak enabled (recommended)</button>
        <button id="btn-nocloak" class="btn" type="button">Open without cloak</button>

        <label class="remember">
            <input type="checkbox" id="remember">
            <span>Don't ask me again</span>
        </label>
        <p class="hint">Cloak opens the site inside an about:blank tab. If that doesn't work on your device (some phones and tablets block it), choose "Open without cloak". To see this menu again later, add <b>?menu</b> to the end of this page's address.</p>
    </main>

    <noscript>
        <div style="text-align:center;padding:20px">
            <h1>Game Hub</h1>
            <a href="cloak.html">Open with cloak enabled (recommended)</a>
            <a href="nocloak.html">Open without cloak</a>
        </div>
    </noscript>

    <script>
        (function () {
            const PREF_KEY = 'gamehub_launch_pref'; // 'cloak' or 'nocloak'
            const CLOAK_URL = 'cloak.html';
            const NOCLOAK_URL = 'nocloak.html';
            const $ = id => document.getElementById(id);

            // use the same colors as the site's saved theme
            try {
                const saved = JSON.parse(localStorage.getItem('gamehub_theme_settings') || 'null');
                if (saved && typeof saved === 'object') {
                    const ok = v => typeof v === 'string' && /^#[0-9a-fA-F]{3,8}$/.test(v);
                    const map = { bgColor: '--bg-color', textColor: '--text-color', accentColor: '--accent-color', cardBg: '--card-bg', btnBg: '--btn-bg', btnText: '--btn-text' };
                    Object.keys(map).forEach(k => { if (ok(saved[k])) document.documentElement.style.setProperty(map[k], saved[k]); });
                }
            } catch (e) {}

            function getPref() {
                try { const v = localStorage.getItem(PREF_KEY); return (v === 'cloak' || v === 'nocloak') ? v : null; } catch (e) { return null; }
            }
            function setPref(v) { try { localStorage.setItem(PREF_KEY, v); } catch (e) {} }
            function clearPref() { try { localStorage.removeItem(PREF_KEY); } catch (e) {} }

            const title = document.title;
            const framed = window.top !== window.self;

            // same about:blank trick the site used before: open a blank tab and show the site inside it
            function launchCloak() {
                if (framed) { location.replace(CLOAK_URL); return true; }
                let w = null;
                try { w = window.open('about:blank', '_blank'); } catch (e) {}
                if (!w) return false;
                try {
                    const d = w.document;
                    d.title = title;
                    d.body.style.margin = '0';
                    d.body.style.overflow = 'hidden';
                    d.body.style.background = '#000';
                    const f = d.createElement('iframe');
                    f.src = new URL(CLOAK_URL, location.href).href;
                    f.allow = 'fullscreen; autoplay; gamepad; clipboard-write';
                    f.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;border:0;';
                    d.body.appendChild(f);
                } catch (e) {
                    try { w.close(); } catch (e2) {}
                    return false;
                }
                window.close();
                setTimeout(() => { window.location.replace('about:blank'); }, 150);
                return true;
            }

            function showNotice(msg) {
                const n = $('notice');
                n.textContent = msg;
                n.hidden = false;
            }

            function choose(mode) {
                const remember = $('remember').checked;
                if (mode === 'cloak') {
                    if (remember) setPref('cloak');
                    if (!launchCloak()) {
                        if (remember) clearPref();
                        showNotice('The cloaked tab was blocked. Allow popups for this site and try again, or choose "Open without cloak".');
                    }
                    return;
                }
                if (remember) setPref('nocloak');
                location.href = NOCLOAK_URL;
            }

            $('btn-cloak').addEventListener('click', () => choose('cloak'));
            $('btn-nocloak').addEventListener('click', () => choose('nocloak'));

            // ?menu shows the menu again and forgets the saved choice
            let pref;
            if (new URLSearchParams(location.search).has('menu')) { clearPref(); pref = null; } else { pref = getPref(); }

            if (pref === 'nocloak') {
                location.replace(NOCLOAK_URL);
                return;
            }
            if (pref === 'cloak') {
                if (launchCloak()) return;
                // browsers only allow the new tab after a tap, so ask for one
                $('menu').hidden = false;
                showNotice('Your saved choice is cloak, but the browser needs a tap to open it. Tap "Open with cloak enabled" below.');
                return;
            }
            $('menu').hidden = false;
        })();
    </script>
</body>
</html>
