<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Furious Finches</title>
<style>
:root{--bg:#f3efe6;--fg:#2a2a2a;--btn:#e8553d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1d24;--fg:#eee}}
:root[data-theme="dark"]{--bg:#1b1d24;--fg:#eee}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
canvas{width:min(100%,calc((100dvh - 80px) * 2));aspect-ratio:2/1;touch-action:none;border-radius:8px;display:block}
.bar{display:flex;gap:12px;align-items:center;font-size:13px;padding:0 8px;text-align:center}
button{background:var(--btn);color:#fff;border:0;border-radius:6px;padding:6px 12px;font-size:13px;cursor:pointer}
</style></head><body>
<canvas id="c" width="1200" height="600"></canvas>
<div class="bar"><button onclick="newLevel()">Reroll level</button><button id="nm" onclick="toggleNM()">Nightmare: OFF</button><span>Click a waiting bird to pick it. Drag back &amp; release to launch. Click mid-air for its power.</span></div>
<script>
const C=document.getElementById('c'),X=C.getContext('2d'),W=1200,H=600,GY=540,AX=190,AY=420,G=.28;
const rnd=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.floor(Math.random()*a.length)];
const TYPES={
 yellow:{n:'Yellow',r:13,m:1,d:'No powers'},
 thuck:{n:'Thuck',r:13,m:1.2,d:'Click mid-air to speed up'},
 pink:{n:'Pink',r:9,m:.6,d:'Click mid-air to split into 3'},
 grenade:{n:'Grenade',r:13,m:1.3,d:'Explodes ~2.5s after impact, or click to detonate'},
 gertrude:{n:'Gertrude',r:15,m:1.5,d:'Click mid-air to drop exploding eggs'}};
const ORDER=['yellow','thuck','pink','grenade','gertrude'];
const MAT={wood:{hp:45,d:1,c:'#b9824a'},stone:{hp:130,d:2.2,c:'#8a8f98'},glass:{hp:18,d:.8,c:'#a8dcf0'}};
const GROUND={im:0,ii:0,vx:0,vy:0,om:0,x:0,y:0};
let blocks=[],birds=[],eggs=[],parts=[],rest=[],sel=0,level=1,score=0,state='aim',wait=0,grace=0,drag=false,cur=null,bonus=0,nm=false;

function mk(x,y,w,h,mat,pig){const M=pig?{hp:nm?55:16,d:.8}:{...MAT[mat],hp:MAT[mat].hp*(nm?1.8:1)},m=w*h/500*M.d;blocks.push({x,y,a:0,w,h,vx:0,vy:0,om:0,hp:M.hp,mhp:M.hp,im:1/m,ii:12/(m*(w*w+h*h)),sl:true,sc:0,mat,pig:!!pig,rad:Math.hypot(w,h)/2});}
function building(cx,stories,cols,gap){
 const cw=14,ch=58,bt=14;let floor=GY,pigs=0;
 for(let s=0;s<stories;s++){
  if(s>0&&cols>2&&Math.random()<.5)cols--;
  const wt=(cols-1)*gap+cw,x0=cx-wt/2+cw/2;
  for(let i=0;i<cols;i++)mk(x0+i*gap,floor-ch/2,cw,ch,pick(['wood','wood','wood','glass','stone']));
  for(let i=0;i<cols-1;i++)if(Math.random()<.6){mk(x0+i*gap+gap/2,floor-12.5,25,25,0,true);pigs++;}
  mk(cx,floor-ch-bt/2,wt+20,bt,pick(['wood','wood','stone','glass']));
  floor-=ch+bt;
 }
 if(Math.random()<.4){mk(cx,floor-12.5,25,25,0,true);pigs++;}
 return pigs;
}
function build(){
 blocks=[];birds=[];eggs=[];parts=[];grace=70;
 const nb=pick([1,1,2,2,3]);let x=rnd(470,560),pigs=0;
 for(let i=0;i<nb;i++){
  const cols=nb>2?2:(Math.random()<.5?3:2),gap=rnd(58,74),wd=(cols-1)*gap+34;
  if(i>0&&x+wd>1150)break;
  pigs+=building(x+wd/2,Math.floor(rnd(nb>1?1:2,nb>1?4.5:5.5)),cols,gap);x+=wd+rnd(40,90);
 }
 if(pigs<2){mk(1100,GY-12.5,25,25,0,true);pigs++;}
 const n=nm?Math.min(4,Math.max(2,Math.ceil(pigs*.4))):Math.min(6,Math.max(3,Math.ceil(pigs*.6)+Math.floor(rnd(0,2))));
 const pool=Math.random()<.3?[pick(ORDER.slice(1))]:[...ORDER].sort(()=>Math.random()-.5).slice(0,Math.floor(rnd(2,5)));
 rest=[];for(let i=0;i<n;i++)rest.push(pick(pool));sel=0;
}
function mkBird(t){const T=TYPES[t];return{circ:1,type:t,x:AX,y:AY,vx:0,vy:0,a:0,om:0,r:T.r,im:1/T.m,ii:0,fuse:-1,age:0,still:0,used:false,hit:false};}
function loadBird(){if(sel>=rest.length)sel=0;cur=mkBird(rest[sel]);state='aim';}
function toggleNM(){nm=!nm;document.getElementById('nm').textContent='Nightmare: '+(nm?'ON':'OFF');level=1;score=0;newLevel();}
function newLevel(){build();loadBird();}

function inBox(B,px,py){
 const c=Math.cos(B.a),s=Math.sin(B.a),dx=px-B.x,dy=py-B.y,lx=dx*c+dy*s,ly=-dx*s+dy*c,ox=B.w/2-Math.abs(lx),oy=B.h/2-Math.abs(ly);
 if(ox<=0||oy<=0)return null;
 if(ox<oy){const g=lx>0?1:-1;return{nx:g*c,ny:g*s,d:ox};}
 const g=ly>0?1:-1;return{nx:-g*s,ny:g*c,d:oy};
}
function verts(b){const c=Math.cos(b.a),s=Math.sin(b.a),p=b.w/2,q=b.h/2;return[[-p,-q],[p,-q],[p,q],[-p,q]].map(([x,y])=>[b.x+x*c-y*s,b.y+x*s+y*c]);}
function circBox(o,B){
 const c=Math.cos(B.a),s=Math.sin(B.a),dx=o.x-B.x,dy=o.y-B.y,lx=dx*c+dy*s,ly=-dx*s+dy*c,hw=B.w/2,hh=B.h/2;
 const qx=Math.max(-hw,Math.min(hw,lx)),qy=Math.max(-hh,Math.min(hh,ly));let ex=lx-qx,ey=ly-qy,d=Math.hypot(ex,ey),pd;
 if(d>=o.r)return null;
 if(d<1e-6){const ox=hw-Math.abs(lx),oy=hh-Math.abs(ly);if(ox<oy){ex=lx>0?1:-1;ey=0;pd=ox+o.r;}else{ex=0;ey=ly>0?1:-1;pd=oy+o.r;}}
 else{ex/=d;ey/=d;pd=o.r-d;}
 return{px:B.x+qx*c-qy*s,py:B.y+qx*s+qy*c,nx:ex*c-ey*s,ny:ex*s+ey*c,d:pd};
}
function imp(a,b,rax,ray,rbx,rby,ix,iy){a.vx+=ix*a.im;a.vy+=iy*a.im;a.om+=(rax*iy-ray*ix)*a.ii;b.vx-=ix*b.im;b.vy-=iy*b.im;b.om-=(rbx*iy-rby*ix)*b.ii;}
function solve(c){
 const{a,b,nx,ny}=c,rax=c.px-a.x,ray=c.py-a.y,rbx=c.px-b.x,rby=c.py-b.y;
 const rv=()=>[(a.vx-a.om*ray)-(b.vx-b.om*rby),(a.vy+a.om*rax)-(b.vy+b.om*rbx)];
 let[vx,vy]=rv();const vn=vx*nx+vy*ny;if(vn>=0)return;
 const rna=rax*ny-ray*nx,rnb=rbx*ny-rby*nx,j=-(1+c.e)*vn/(a.im+b.im+rna*rna*a.ii+rnb*rnb*b.ii);
 imp(a,b,rax,ray,rbx,rby,nx*j,ny*j);
 if(grace<=0){const k=(a.circ||b.circ)?6:3.5;for(const o of[a,b])if(o.hp!==undefined){const q=j-(o.pig?1.2:2.5);if(q>0)o.hp-=q*k*(o.pig?2.5:1);}}
 [vx,vy]=rv();const tx=-ny,ty=nx,vt=vx*tx+vy*ty,rta=rax*ty-ray*tx,rtb=rbx*ty-rby*tx;
 const m=.8*j;let jt=-vt/(a.im+b.im+rta*rta*a.ii+rtb*rtb*b.ii);jt=Math.max(-m,Math.min(m,jt));
 imp(a,b,rax,ray,rbx,rby,tx*jt,ty*jt);
}
function bump(b){b.hit=true;if(b.type==='grenade'&&b.fuse<0)b.fuse=150;}
function physics(){
 const N=3,dt=1/N;
 for(let s=0;s<N;s++){
  const cs=[];
  for(let i=0;i<blocks.length;i++){
   const A=blocks[i];
   for(const[x,y]of verts(A))if(y>GY)cs.push({a:A,b:GROUND,px:x,py:y,nx:0,ny:-1,d:y-GY,e:0});
   for(let j=i+1;j<blocks.length;j++){
    const B=blocks[j];if(Math.hypot(A.x-B.x,A.y-B.y)>A.rad+B.rad)continue;
    for(const[x,y]of verts(A)){const r=inBox(B,x,y);if(r)cs.push({a:A,b:B,px:x,py:y,nx:r.nx,ny:r.ny,d:r.d,e:0});}
    for(const[x,y]of verts(B)){const r=inBox(A,x,y);if(r)cs.push({a:B,b:A,px:x,py:y,nx:r.nx,ny:r.ny,d:r.d,e:0});}
   }
  }
  for(const o of birds){
   if(o.y+o.r>GY){cs.push({a:o,b:GROUND,px:o.x,py:GY,nx:0,ny:-1,d:o.y+o.r-GY,e:.3});bump(o);}
   for(const B of blocks){if(Math.hypot(o.x-B.x,o.y-B.y)>o.r+B.rad)continue;const r=circBox(o,B);if(r){B.sl=false;B.sc=0;cs.push({a:o,b:B,px:r.px,py:r.py,nx:r.nx,ny:r.ny,d:r.d,e:.3});bump(o);}}
  }
  for(const c of cs){const k=Math.max(c.d-.5,0)*.4/(c.a.im+c.b.im);c.a.x+=c.nx*k*c.a.im;c.a.y+=c.ny*k*c.a.im;c.b.x-=c.nx*k*c.b.im;c.b.y-=c.ny*k*c.b.im;}
  for(const o of blocks)if(!o.sl)o.vy+=G*dt;for(const o of birds)o.vy+=G*dt;
  for(let it=0;it<12;it++)for(const c of cs)solve(c);
  for(const o of blocks){if(o.sl){if(Math.hypot(o.vx,o.vy)>.5||Math.abs(o.om)>.03){o.sl=false;o.sc=0;}else{o.vx=o.vy=o.om=0;continue;}}o.x+=o.vx*dt;o.y+=o.vy*dt;o.a+=o.om*dt;}
  for(const o of birds){o.x+=o.vx*dt;o.y+=o.vy*dt;}
  for(const e of eggs){
   e.vy+=G*dt;e.x+=e.vx*dt;e.y+=e.vy*dt;
   if(e.y+6>GY||blocks.some(B=>Math.hypot(e.x-B.x,e.y-B.y)<B.rad+6&&circBox(e,B))){e.dead=true;boom(e.x,e.y,60,60);}
  }
  eggs=eggs.filter(e=>!e.dead);
 }
 for(const o of blocks){
  if(o.sl)continue;o.om*=.99;
  if(Math.hypot(o.vx,o.vy)<.25&&Math.abs(o.om)<.015){if(++o.sc>12){o.sl=true;o.vx=o.vy=o.om=0;}}else o.sc=0;
 }
}
function boom(x,y,R,P){
 for(let i=0;i<26;i++)parts.push({x,y,vx:rnd(-1,1)*R/10,vy:rnd(-1,1)*R/10,l:30,c:i%2?'#ffb703':'#fb5607',r:rnd(3,7)});
 parts.push({x,y,ring:R,l:18});
 for(const k of blocks){
  const dx=k.x-x,dy=k.y-y,d=Math.hypot(dx,dy)||1,f=1-Math.max(0,d-k.rad)/R;
  if(f<=0)continue;k.sl=false;k.sc=0;
  k.hp-=f*P;const im=f*P*.12*Math.sqrt(k.im);k.vx+=dx/d*im;k.vy+=dy/d*im-f*2;k.om+=rnd(-1,1)*f*P*.004*k.ii*40;
 }
}
function activate(){
 for(const b of birds.slice()){
  if(b.used||b.dead)continue;b.used=true;
  if(b.type==='thuck'){b.vx*=2.1;b.vy*=2.1;}
  else if(b.type==='pink'){for(const a of[-.3,.3]){const c=Math.cos(a),s=Math.sin(a);birds.push({...b,vx:b.vx*c-b.vy*s,vy:b.vx*s+b.vy*c,used:true,still:0});}}
  else if(b.type==='grenade'){boom(b.x,b.y,100,95);b.dead=true;}
  else if(b.type==='gertrude'){b.eggs=3;b.eggT=0;}
 }
}
function update(){
 if(grace>0)grace--;
 physics();
 for(const b of birds){
  if(b.dead)continue;b.age++;
  if(b.eggs>0&&--b.eggT<=0){eggs.push({circ:1,r:6,x:b.x,y:b.y+b.r,vx:0,vy:6});b.eggs--;b.eggT=12;b.vy-=1.2;}
  if(b.fuse>=0&&--b.fuse<=0){boom(b.x,b.y,100,95);b.dead=true;}
  b.still=b.hit&&Math.hypot(b.vx,b.vy)<.8?b.still+1:0;
  if((b.still>50&&b.type!=='grenade')||b.age>900||b.x>W+200||b.x<-100||b.y>H+100)b.dead=true;
 }
 birds=birds.filter(b=>!b.dead);
 for(const k of blocks)if(k.hp<=0||k.x>W+100||k.x<-100||k.y>H+200){k.dead=true;score+=k.pig?500:50;for(let i=0;i<8;i++)parts.push({x:k.x,y:k.y,vx:rnd(-3,3),vy:rnd(-4,0),l:30,c:k.pig?'#7ec850':MAT[k.mat].c,r:rnd(2,5)});}
 if(blocks.some(k=>k.dead))blocks.forEach(k=>{k.sl=false;k.sc=0;});blocks=blocks.filter(k=>!k.dead);
 for(const p of parts){p.l--;if(!p.ring){p.x+=p.vx;p.y+=p.vy;p.vy+=.15;}}
 parts=parts.filter(p=>p.l>0);
 const pigs=blocks.filter(k=>k.pig).length;
 if(state==='fly'&&!birds.length&&!eggs.length){state='settle';wait=80;}
 else if(state==='settle'&&--wait<=0){
  if(pigs===0){bonus=rest.length*1000;score+=bonus;state='won';}
  else if(!rest.length)state='lost';
  else loadBird();
 }
}
function slots(){const o=[];let j=0;rest.forEach((t,i)=>{if(state==='aim'&&i===sel)return;o.push({i,t,x:AX-50-j*30,y:GY-12});j++;});return o;}
function pos(e){const r=C.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height};}
function mv(p){let dx=p.x-AX,dy=p.y-AY,d=Math.hypot(dx,dy);if(d>85){dx*=85/d;dy*=85/d;}cur.x=AX+dx;cur.y=AY+dy;}
C.onpointerdown=e=>{
 const p=pos(e);C.setPointerCapture(e.pointerId);
 if(state==='won'){level++;newLevel();return;}
 if(state==='lost'){newLevel();return;}
 for(const s of slots())if(Math.hypot(p.x-s.x,p.y-s.y)<20){sel=s.i;if(state==='aim')cur=mkBird(rest[sel]);return;}
 if(state==='aim'&&Math.hypot(p.x-cur.x,p.y-cur.y)<60){drag=true;mv(p);}
 else if(state==='fly')activate();
};
C.onpointermove=e=>{if(drag)mv(pos(e));};
C.onpointerup=()=>{
 if(!drag)return;drag=false;
 const dx=AX-cur.x,dy=AY-cur.y;
 if(Math.hypot(dx,dy)<15){cur.x=AX;cur.y=AY;return;}
 cur.vx=dx*.21;cur.vy=dy*.21;birds.push(cur);rest.splice(sel,1);sel=0;state='fly';
};

function eye(r){X.fillStyle='#fff';X.beginPath();X.arc(r*.3,-r*.2,r*.3,0,7);X.fill();X.fillStyle='#000';X.beginPath();X.arc(r*.4,-r*.2,r*.13,0,7);X.fill();X.beginPath();X.moveTo(0,-r*.7);X.lineTo(r*.7,-r*.4);X.stroke();}
function beak(r){X.fillStyle='#ff9f1c';X.beginPath();X.moveTo(r*.75,-r*.05);X.lineTo(r*1.3,r*.15);X.lineTo(r*.75,r*.4);X.closePath();X.fill();X.stroke();}
function drawBird(b,x,y,sc){
 const t=b.type,r=b.r;X.save();X.translate(x,y);X.scale(sc||1,sc||1);X.lineWidth=2;X.strokeStyle='#222';
 if(t==='yellow'||t==='pink'){X.fillStyle=t==='yellow'?'#ffd23f':'#ff7eb6';X.beginPath();X.arc(0,0,r,0,7);X.fill();X.stroke();eye(r);beak(r);}
 else if(t==='thuck'){X.rotate(b.hit||!b.vx?0:Math.atan2(b.vy,b.vx));X.fillStyle='#e63946';X.beginPath();X.moveTo(r*1.2,0);X.lineTo(-r,-r*1.05);X.lineTo(-r,r*1.05);X.closePath();X.fill();X.stroke();X.translate(-r*.1,0);eye(r*.7);}
 else if(t==='grenade'){
  X.fillStyle=b.fuse>0&&b.fuse%16<8?'#ff5050':'#3f9b3f';
  X.beginPath();X.ellipse(0,2,r*.95,r*1.05,0,0,7);X.fill();X.stroke();
  X.beginPath();X.moveTo(-r*.9,-r*.1);X.lineTo(r*.9,-r*.1);X.moveTo(-r*.8,r*.5);X.lineTo(r*.8,r*.5);X.stroke();
  X.fillStyle='#555';X.fillRect(-r*.4,-r*1.3,r*.8,r*.4);X.strokeRect(-r*.4,-r*1.3,r*.8,r*.4);
  X.beginPath();X.moveTo(r*.4,-r*1.25);X.lineTo(r*.95,-r*.85);X.stroke();X.beginPath();X.arc(-r*.6,-r*1.3,r*.25,0,7);X.stroke();eye(r*.8);}
 else{X.fillStyle='#3a86ff';X.beginPath();X.ellipse(0,0,r*1.15,r*.85,0,0,7);X.fill();X.stroke();X.fillStyle='#9cc3ff';X.beginPath();X.ellipse(-r*.1,r*.35,r*.7,r*.4,0,0,Math.PI);X.fill();eye(r);beak(r*.95);}
 X.restore();
}
function drawPig(k){
 X.save();X.translate(k.x,k.y);X.rotate(k.a);X.lineWidth=2;X.strokeStyle='#244';
 X.fillStyle=k.hp<k.mhp*.6?'#a3c97a':'#7ec850';X.beginPath();X.arc(0,0,13,0,7);X.fill();X.stroke();
 X.fillStyle='#5fa23a';X.beginPath();X.ellipse(0,3,6,4.5,0,0,7);X.fill();X.stroke();
 X.fillStyle='#244';X.fillRect(-3,2,2,3);X.fillRect(1,2,2,3);
 X.fillStyle='#fff';X.beginPath();X.arc(-5,-5,3,0,7);X.arc(5,-5,3,0,7);X.fill();
 X.fillStyle='#000';X.beginPath();X.arc(-5,-5,1.2,0,7);X.arc(5,-5,1.2,0,7);X.fill();X.restore();
}
function draw(){
 const g=X.createLinearGradient(0,0,0,GY);g.addColorStop(0,nm?'#05061a':'#6ec6ff');g.addColorStop(1,nm?'#2a2150':'#d8f1ff');X.fillStyle=g;X.fillRect(0,0,W,H);
 if(nm){X.fillStyle='#fff';for(let i=0;i<70;i++){X.globalAlpha=.4+.5*Math.abs(Math.sin(i*7.3));X.fillRect((i*173.7)%W,(i*91.3)%300,1.8,1.8);}X.globalAlpha=1;X.fillStyle='#f4f1d0';X.beginPath();X.arc(1010,95,34,0,7);X.fill();X.fillStyle='#2a2150';X.beginPath();X.arc(1025,88,30,0,7);X.fill();}
 X.fillStyle=nm?'#16283a':'#8fd28a';X.beginPath();X.ellipse(380,GY,430,80,0,Math.PI,0);X.fill();X.fillStyle=nm?'#10202d':'#6fbf73';X.beginPath();X.ellipse(950,GY,330,55,0,Math.PI,0);X.fill();
 X.fillStyle=nm?'#2b2018':'#7a5a3a';X.fillRect(0,GY,W,H-GY);X.fillStyle=nm?'#1f4a33':'#4caf50';X.fillRect(0,GY,W,10);
 X.strokeStyle='#5a3a1e';X.lineWidth=9;X.lineCap='round';X.beginPath();X.moveTo(AX,GY);X.lineTo(AX,AY+40);X.moveTo(AX,AY+40);X.lineTo(AX-14,AY+5);X.moveTo(AX,AY+40);X.lineTo(AX+14,AY+5);X.stroke();
 for(const s of slots()){drawBird(mkBird(s.t),s.x,s.y,.85);if(state!=='aim'&&s.i===sel){X.strokeStyle='#fff';X.lineWidth=2;X.beginPath();X.arc(s.x,s.y,19,0,7);X.stroke();}}
 if(state==='aim'&&cur){
  X.strokeStyle='#3b2410';X.lineWidth=5;X.beginPath();X.moveTo(AX-14,AY+5);X.lineTo(cur.x,cur.y);X.stroke();
  if(drag){let x=cur.x,y=cur.y,vx=(AX-x)*.21,vy=(AY-y)*.21;X.fillStyle='rgba(255,255,255,.85)';
   for(let i=0;i<90&&y<GY;i++){for(let s=0;s<3;s++){vy+=G/3;x+=vx/3;y+=vy/3;}if(i%6==5){X.beginPath();X.arc(x,y,3,0,7);X.fill();}}}
  drawBird(cur,cur.x,cur.y);
  X.strokeStyle='#3b2410';X.lineWidth=5;X.beginPath();X.moveTo(AX+14,AY+5);X.lineTo(cur.x,cur.y);X.stroke();
 }
 X.lineCap='butt';
 for(const k of blocks){
  if(k.pig){drawPig(k);continue;}
  X.save();X.translate(k.x,k.y);X.rotate(k.a);X.globalAlpha=k.mat==='glass'?.75:1;X.fillStyle=MAT[k.mat].c;X.fillRect(-k.w/2,-k.h/2,k.w,k.h);
  X.globalAlpha=1;X.strokeStyle='#3a2a1a';X.lineWidth=1.5;X.strokeRect(-k.w/2,-k.h/2,k.w,k.h);
  if(k.hp<k.mhp*.6){X.beginPath();X.moveTo(-k.w/2,-k.h/4);X.lineTo(0,0);X.lineTo(k.w/2,k.h/4);X.stroke();}
  X.restore();
 }
 for(const b of birds)drawBird(b,b.x,b.y);
 X.fillStyle='#fff';X.strokeStyle='#555';X.lineWidth=1.5;for(const e of eggs){X.beginPath();X.ellipse(e.x,e.y,5,7,0,0,7);X.fill();X.stroke();}
 for(const p of parts){
  if(p.ring){X.strokeStyle=`rgba(255,160,0,${p.l/18})`;X.lineWidth=4;X.beginPath();X.arc(p.x,p.y,p.ring*(1-p.l/18),0,7);X.stroke();}
  else{X.globalAlpha=p.l/30;X.fillStyle=p.c;X.beginPath();X.arc(p.x,p.y,p.r,0,7);X.fill();X.globalAlpha=1;}
 }
 if(nm){X.fillStyle='rgba(10,10,60,.2)';X.fillRect(0,0,W,H);}
 X.fillStyle='rgba(0,0,0,.35)';X.fillRect(0,0,W,40);X.fillStyle='#fff';X.font='bold 16px system-ui';X.textAlign='left';
 X.fillText(`${nm?'NIGHTMARE · ':''}Level ${level}   Score ${score}   Pigs ${blocks.filter(k=>k.pig).length}   Birds ${rest.length}`,14,26);
 X.textAlign='right';const sb=state==='aim'?cur:birds.find(b=>!b.used)||(rest[sel]&&mkBird(rest[sel]));
 if(sb&&state!=='won'&&state!=='lost')X.fillText(TYPES[sb.type].n+' — '+TYPES[sb.type].d,W-14,26);
 if(state==='won'||state==='lost'){
  X.fillStyle='rgba(0,0,0,.55)';X.fillRect(0,0,W,H);X.fillStyle='#fff';X.textAlign='center';
  X.font='bold 52px system-ui';X.fillText(state==='won'?'Level clear!':'Out of finches!',W/2,H/2-10);
  X.font='20px system-ui';X.fillText(state==='won'?`Unused bird bonus +${bonus}. Click for next level.`:'Click to try a new level.',W/2,H/2+30);
 }
}
let last=performance.now(),acc=0;
function loop(t){acc=Math.min(acc+t-last,100);last=t;while(acc>=16.667){update();acc-=16.667;}draw();requestAnimationFrame(loop);}
newLevel();requestAnimationFrame(loop);
</script></body></html>
