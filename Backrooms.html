<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Backrooms - Found Footage</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: 'Courier New', Courier, monospace; }
        
        .scanlines {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.2) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 4px, 3px 100%;
            pointer-events: none; z-index: 10;
        }

        .vhs-text {
            position: fixed; bottom: 30px; left: 30px; color: white;
            font-size: 24px; text-shadow: 2px 2px 0px #000;
            pointer-events: none; z-index: 11; opacity: 0.8;
        }

        .blinking-rec { color: red; animation: blinker 1.5s linear infinite; }
        @keyframes blinker { 50% { opacity: 0; } }

        #blocker {
            position: absolute; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.8); display: flex;
            flex-direction: column; align-items: center; justify-content: center;
            color: white; z-index: 20; text-align: center;
        }

        #instructions {
            font-size: 20px; cursor: pointer; background: #222;
            padding: 30px; border: 2px solid white; box-shadow: 0 0 20px rgba(255,255,255,0.2);
            max-width: 600px;
        }
    </style>
</head>
<body>

    <div class="scanlines"></div>
    <div class="vhs-text"><span class="blinking-rec">● REC</span> <br> <span id="time-display">JUL 04 1996<br>AM 12:00:00</span></div>

    <div id="blocker">
        <div id="instructions">
            <h1>THE BACKROOMS</h1>
            <p><strong>Anomaly Added:</strong> Impossible Geometry & The Infinite Corridor.</p>
            <p>Click to start the tape.</p>
            <p>W, A, S, D = Move | MOUSE = Look</p>
            <p style="color:#aaa; font-size:14px;">Don't look back.</p>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>

    <script>
        let camera, scene, renderer, controls;
        let wallGeometry, wallMaterial; // Hoisted for dynamic map updates
        
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        let prevTime = performance.now();
        const velocity = new THREE.Vector3();
        const direction = new THREE.Vector3();
        const lookDirection = new THREE.Vector3(); // Used for tracking where player is looking
        
        let isFalling = false;
        let velocityY = 0;
        let nonEuclideanTriggered = false; // Tracks if the impossible geometry trap has snapped

        const TILE_SIZE = 20;
        
        // Map string parser
        // W = Wall, . = Empty, P = Pillar, X = Pitfall Hole
        const mapString = [
            "WWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWW",
            "W...W.....W.......W............W.......W.........W",
            "W...W.WWW.W.WWWWW.W.WWWWWWWWWW.W.WWWWW.W.WWWWWWW.W",
            "W.......W.W.....W.W..........W.W.....W.W.......W.W",
            "WWWWWWW.W.WWWWW.W.WWWWWWWWWW.W.WWWWW.W.WWWWWWW.W.W",
            "W.......W.......W..........W.W.....W...W.......W.W",
            "W.WWWWWWWWWWWWWWWWWWWWWWWW.W.W.WWW.WWW.W.WWWWWWW.W",
            "W.W........................W.W...W...W.W.W.....W.W",
            "W.W.WWWWWWWWWWWWWWWWWWWWWWWW.WWWWW.W.W.W.W.WWW.W.W",
            "W.W................................W...W.W...W.W.W",
            "W.WWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWW.W.WWW.W.W.W",
            "W......................................W.....W.W.W",
            "W......................................WWWWWWW.W.W",
            "W..............................................W.W",
            "W..............................................W.W",
            "W..............................................W.W",
            "W.WWWWWW.WWWWWWW.WWWWWWW.WWWWWWW.WWWWWWWWWWWWWWW.W",
            "W.W....W.W.....W.W.....W.W.....W.W...............W",
            "W.W....W.W.....W.W.....W.W.....W.W.WWWWWWWWWWWWW.W",
            "W.W....W.W.....W.W.....W.W.....W.W.W...........W.W",
            "W.WW..WW.WWWWW.W.WWWWW.W.WWWWW.W.W.W.WWWWWWWWW.W.W",
            "W.W....W.......W.......W.......W.W.W.W.......W.W.W",
            "W.W....WWWWWWWWWWWWWWWWWWWWWWWWWWW.W.W.WWWWW.W.W.W",
            "W.W................................W.W.....W.W.W.W",
            "W.WWWWWWWWWWWWWWW.WWWWWWWWWW.WWWWWWW.WWWWW.W.W.W.W",
            "W.W.............W..........W.W...........W.W.W.W.W",
            "W.W.WWWWWWWWWWW.W.WWWWWWWW.W.W.P..P..P...W.W.W.W.W",
            "W.W.WXXXXXXXXXW.W.W......W.W.W...........W.W.W...W",
            "W.W.WXXXXXXXXXW.W.W......W.W.W.P..P..P...W.W.WWWWW",
            "W.W.WXXXXXXXXXW.W.W......W.W.W...........W.W.....W",
            "W.W.WXXXXXXXXXW.W.W......W.W.W.P..P..P...W.WWWWW.W",
            "W.W.WXXXXXXXXXW.W.W......W.W.W...........W.....W.W",
            "W.W.WWWWWWWWWWW.W.WWWWWWWW.W.W.P..P..P...WWWWW.W.W",
            "W.W.............W..........W.W...............W.W.W",
            "W.WWWWWWWWWWWWWWW.WWWWWWWWWW.WWWWWWWWWWWWWWWWW.W.W",
            "W............................W.................W.W",
            "W............................W.P..P..P..P..P...W.W",
            "W.WWWWWWWWWWWWWWWWWWWWWWWWWW.W.................W.W",
            "W.W........................W.W.P..P..P..P..P...W.W",
            "W.W.WWWWWWWWWWWWWWWWWWWWWW.W.W.................W.W",
            "W.W.W....................W.W.WWWWWWWWWWWWWWWWWWW.W",
            "W.W.W.W.W.W.W.W.W.W.W.W..W.W.....................W",
            "W.W.W....................W.W.WWWWWWWWWWWWWWWWWWWWW",
            "W.W.WWWWWWWWWWWWWWWWWWWWWW.W.....................W",
            "W.W........................WWWWWWWWWWWWWWWWWWWWW.W",
            "W.WWWWWWWW.WWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWW", // Row 46: Gap at X=9
            "W.........W......................................W", // Row 47: The Infinite Corridor starts at X=11
            "WWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWW"
        ];

        const levelMap = [];
        for (let z = 0; z < mapString.length; z++) {
            const row = [];
            for (let x = 0; x < mapString[z].length; x++) {
                if (mapString[z][x] === 'W') row.push(1);
                else if (mapString[z][x] === '.') row.push(0);
                else if (mapString[z][x] === 'P') row.push(2);
                else if (mapString[z][x] === 'X') row.push(3);
            }
            levelMap.push(row);
        }

        const START_X = 2;
        const START_Z = 1;

        init();
        animate();

        function generateWallTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 256; canvas.height = 256;
            const context = canvas.getContext('2d');
            context.fillStyle = '#d9cc9e'; context.fillRect(0, 0, 256, 256);
            context.strokeStyle = '#c4b581'; context.lineWidth = 4;
            for(let i=0; i<256; i+=32) {
                context.beginPath(); context.moveTo(i, 0); context.lineTo(i, 256); context.stroke();
                context.beginPath(); context.moveTo(i+8, 0); context.lineTo(i+8, 256); context.stroke();
            }
            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping;
            tex.repeat.set(2, 2);
            return tex;
        }

        function generateFloorTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 256; canvas.height = 256;
            const context = canvas.getContext('2d');
            context.fillStyle = '#5c4d29'; context.fillRect(0, 0, 256, 256);
            for(let i=0; i<4000; i++) {
                context.fillStyle = Math.random() > 0.5 ? '#4a3d1f' : '#6b5c38';
                context.fillRect(Math.random() * 256, Math.random() * 256, 2, 2);
            }
            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping;
            tex.repeat.set(1, 1); 
            return tex;
        }

        function generateCeilingTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 256; canvas.height = 256;
            const context = canvas.getContext('2d');
            context.fillStyle = '#dcdcdc'; context.fillRect(0, 0, 256, 256);
            context.strokeStyle = '#aaaaaa'; context.lineWidth = 8;
            context.strokeRect(0, 0, 256, 256);
            if(Math.random() > 0.7) {
                context.fillStyle = '#ffffff';
                context.fillRect(20, 20, 216, 216);
            }
            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping;
            tex.repeat.set(100, 100); 
            return tex;
        }

        function init() {
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 1, 1000);
            camera.position.set(START_X * TILE_SIZE, 10, START_Z * TILE_SIZE);

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xd9cc9e);
            scene.fog = new THREE.FogExp2(0xd9cc9e, 0.012);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);
            const dirLight = new THREE.DirectionalLight(0xfff0c2, 0.5);
            dirLight.position.set(200, 300, 100);
            scene.add(dirLight);

            controls = new THREE.PointerLockControls(camera, document.body);

            const blocker = document.getElementById('blocker');
            const instructions = document.getElementById('instructions');

            instructions.addEventListener('click', function () { controls.lock(); });
            controls.addEventListener('lock', function () { blocker.style.display = 'none'; });
            controls.addEventListener('unlock', function () { blocker.style.display = 'flex'; });
            scene.add(controls.getObject());

            const onKeyDown = function (event) {
                switch (event.code) {
                    case 'ArrowUp': case 'KeyW': moveForward = true; break;
                    case 'ArrowLeft': case 'KeyA': moveLeft = true; break;
                    case 'ArrowDown': case 'KeyS': moveBackward = true; break;
                    case 'ArrowRight': case 'KeyD': moveRight = true; break;
                }
            };
            const onKeyUp = function (event) {
                switch (event.code) {
                    case 'ArrowUp': case 'KeyW': moveForward = false; break;
                    case 'ArrowLeft': case 'KeyA': moveLeft = false; break;
                    case 'ArrowDown': case 'KeyS': moveBackward = false; break;
                    case 'ArrowRight': case 'KeyD': moveRight = false; break;
                }
            };
            document.addEventListener('keydown', onKeyDown);
            document.addEventListener('keyup', onKeyUp);

            wallGeometry = new THREE.BoxGeometry(TILE_SIZE, TILE_SIZE, TILE_SIZE);
            wallMaterial = new THREE.MeshLambertMaterial({ map: generateWallTexture() });
            
            const floorMaterial = new THREE.MeshLambertMaterial({ map: generateFloorTexture() });
            const ceilingMaterial = new THREE.MeshLambertMaterial({ map: generateCeilingTexture() });
            const pillarGeometry = new THREE.BoxGeometry(TILE_SIZE * 0.8, TILE_SIZE, TILE_SIZE * 0.8);
            const floorTileGeo = new THREE.PlaneGeometry(TILE_SIZE, TILE_SIZE);
            floorTileGeo.rotateX(-Math.PI / 2);

            for (let z = 0; z < levelMap.length; z++) {
                for (let x = 0; x < levelMap[z].length; x++) {
                    const type = levelMap[z][x];
                    if (type === 1) { 
                        const wall = new THREE.Mesh(wallGeometry, wallMaterial);
                        wall.position.set(x * TILE_SIZE, 10, z * TILE_SIZE);
                        scene.add(wall);
                    } else if (type === 2) { 
                        const pillar = new THREE.Mesh(pillarGeometry, wallMaterial);
                        pillar.position.set(x * TILE_SIZE, 10, z * TILE_SIZE);
                        scene.add(pillar);
                    }
                    if (type !== 3) {
                        const floorTile = new THREE.Mesh(floorTileGeo, floorMaterial);
                        floorTile.position.set(x * TILE_SIZE, 0, z * TILE_SIZE);
                        scene.add(floorTile);
                    }
                }
            }

            const ceilGeo = new THREE.PlaneGeometry(levelMap[0].length * TILE_SIZE, levelMap.length * TILE_SIZE);
            const ceiling = new THREE.Mesh(ceilGeo, ceilingMaterial);
            ceiling.rotation.x = Math.PI / 2;
            ceiling.position.set((levelMap[0].length * TILE_SIZE)/2 - TILE_SIZE/2, 20, (levelMap.length * TILE_SIZE)/2 - TILE_SIZE/2);
            scene.add(ceiling);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            window.addEventListener('resize', onWindowResize);
            setInterval(updateVHSClock, 1000);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function updateVHSClock() {
            const now = new Date();
            let hours = now.getHours();
            let minutes = now.getMinutes();
            let seconds = now.getSeconds();
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12; hours = hours ? hours : 12; 
            minutes = minutes < 10 ? '0' + minutes : minutes;
            seconds = seconds < 10 ? '0' + seconds : seconds;
            document.getElementById('time-display').innerHTML = `JUL 04 1996<br>${ampm} ${hours}:${minutes}:${seconds}`;
        }

        function checkCollision(x, z) {
            const gridX = Math.round(x / TILE_SIZE);
            const gridZ = Math.round(z / TILE_SIZE);
            if(gridZ < 0 || gridZ >= levelMap.length || gridX < 0 || gridX >= levelMap[0].length) return true;
            if(levelMap[gridZ][gridX] === 1 || levelMap[gridZ][gridX] === 2) return true;
            return false;
        }

        function animate() {
            requestAnimationFrame(animate);
            const time = performance.now();

            if (controls.isLocked === true) {
                const delta = (time - prevTime) / 1000;
                
                const gridX = Math.round(camera.position.x / TILE_SIZE);
                const gridZ = Math.round(camera.position.z / TILE_SIZE);
                
                // --- NON-EUCLIDEAN MECHANICS ---

                // 1. The Disappearing Door Trap
                if (!nonEuclideanTriggered && gridZ === 47 && camera.position.x > 22 * TILE_SIZE) {
                    camera.getWorldDirection(lookDirection);
                    // If the player is facing East (away from the entrance behind them)
                    if (lookDirection.x > 0.5) { 
                        nonEuclideanTriggered = true;
                        
                        // Silently seal the hallway behind them at X=15
                        levelMap[47][15] = 1; 
                        const sealedWall = new THREE.Mesh(wallGeometry, wallMaterial);
                        sealedWall.position.set(15 * TILE_SIZE, 10, 47 * TILE_SIZE);
                        scene.add(sealedWall);
                    }
                }

                // 2. The Infinite Looping Hallway
                // Teleports the player backwards exactly 20 tiles. The fog hides the endpoint, making it a seamless visual loop.
                if (gridZ === 47) {
                    if (camera.position.x > 38 * TILE_SIZE) {
                        camera.position.x -= 20 * TILE_SIZE; 
                    }
                }

                // --- PHYSICS & MOVEMENT ---

                if (gridZ >= 0 && gridZ < levelMap.length && gridX >= 0 && gridX < levelMap[0].length) {
                    if (levelMap[gridZ][gridX] === 3) isFalling = true;
                }

                if (isFalling) {
                    velocityY -= 300.0 * delta; 
                    camera.position.y += velocityY * delta;
                    
                    direction.z = Number(moveForward) - Number(moveBackward);
                    direction.x = Number(moveRight) - Number(moveLeft);
                    direction.normalize();
                    if (moveForward || moveBackward) controls.moveForward((direction.z * 50.0) * delta);
                    if (moveLeft || moveRight) controls.moveRight((direction.x * 50.0) * delta);

                    if (camera.position.y < -250) {
                        // Respawn resets everything, even the impossible geometry trap
                        camera.position.set(START_X * TILE_SIZE, 10, START_Z * TILE_SIZE);
                        velocityY = 0;
                        isFalling = false;
                        if(nonEuclideanTriggered) {
                           window.location.reload(); // Hard reload to clear the dynamically added walls safely
                        }
                    }
                } else {
                    velocity.x -= velocity.x * 10.0 * delta;
                    velocity.z -= velocity.z * 10.0 * delta;

                    direction.z = Number(moveForward) - Number(moveBackward);
                    direction.x = Number(moveRight) - Number(moveLeft);
                    direction.normalize(); 

                    if (moveForward || moveBackward) velocity.z -= direction.z * 100.0 * delta;
                    if (moveLeft || moveRight) velocity.x -= direction.x * 100.0 * delta;

                    if (moveForward || moveBackward || moveLeft || moveRight) {
                        camera.position.y = 10 + Math.sin(time * 0.006) * 0.4;
                    } else {
                        camera.position.y = 10;
                    }

                    const stepX = -velocity.x * delta;
                    const stepZ = -velocity.z * delta;

                    controls.moveRight(stepX);
                    if(checkCollision(camera.position.x, camera.position.z)) {
                        controls.moveRight(-stepX); 
                        velocity.x = 0;
                    }

                    controls.moveForward(stepZ);
                    if(checkCollision(camera.position.x, camera.position.z)) {
                        controls.moveForward(-stepZ); 
                        velocity.z = 0;
                    }
                }
            }

            prevTime = time;
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
