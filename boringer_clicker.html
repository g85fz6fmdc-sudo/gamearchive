<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body {
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        .rectangle {
            width: 240px;
            height: 140px;
            background-color: #ffffff;
            border: 2px solid #000000;
            cursor: pointer;
            outline: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .rectangle.clicked {
            border-color: #888888;
        }
    </style>
</head>
<body>
    <div id="box" class="rectangle"></div>

    <script>
        const box = document.getElementById('box');
        box.addEventListener('click', function() {
            box.classList.toggle('clicked');
        });
    </script>
</body>
</html>
