<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tom Pearl Simulator</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: #0f172a;
            user-select: none;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
    </style>
</head>
<body class="text-white relative min-h-screen">

    <!-- WebGL Canvas Container -->
    <div id="canvas-container"></div>

    <!-- Title Screen Overlay -->
    <div id="title-screen" class="absolute inset-0 bg-slate-950/90 backdrop-blur-md flex flex-col items-center justify-center z-50 transition-opacity duration-500">
        <div class="max-w-md w-11/12 bg-slate-900 p-8 rounded-2xl shadow-2xl border border-slate-800 text-center">
            <h1 class="text-4xl font-extrabold text-amber-500 tracking-tight mb-3">Tom Pearl Simulator</h1>
            <p class="text-slate-300 text-sm mb-8 leading-relaxed">
                
            </p>
            <button id="start-btn" class="w-full py-4 bg-amber-600 hover:bg-amber-500 active:bg-amber-700 text-slate-950 font-bold text-lg rounded-xl shadow-lg hover:shadow-amber-500/20 transition transform active:scale-95">
                Start Game
            </button>
        </div>
    </div>

    <!-- HUD Overlay -->
    <div id="hud" class="absolute top-6 left-6 z-10 pointer-events-none hidden">
        <div class="bg-slate-900/85 backdrop-blur border border-slate-800 px-5 py-3 rounded-xl shadow-xl flex items-center gap-3">
            <div class="w-4 h-4 rounded-full bg-amber-800 border border-amber-600"></div>
            <span class="text-slate-200 font-semibold text-lg">Poop Eaten: <strong id="eaten-count" class="text-amber-400 font-extrabold text-xl ml-1">0</strong></span>
        </div>
    </div>

    <!-- Interaction Prompt -->
    <div id="interaction-prompt" class="absolute bottom-12 left-1/2 transform -translate-x-1/2 z-10 pointer-events-none hidden transition-opacity duration-300 opacity-0">
        <div class="bg-amber-500 text-slate-950 font-black px-6 py-3 rounded-full shadow-2xl border-2 border-amber-300 flex items-center gap-2 tracking-wide text-lg uppercase animate-bounce">
            <span>Press <kbd class="bg-slate-950 text-amber-400 px-2.5 py-1 rounded-md text-base">E</kbd> to Eat</span>
        </div>
    </div>

    <script>
        // Game Engine Variables
        let scene, camera, renderer;
        let playerGroup, torsoGroup, headMesh, hairMesh;
        let faceCanvas, faceCtx, faceTexture;
        let chocolateGroup, plateMesh;
        let gameStarted = false;
        let chocolateBarsEaten = 0;
        let isChocolateAvailable = true;
        let isRegenerating = false;
        let isNearTable = false;

        // Vomit Animation State
        let isVomiting = false;
        let vomitTimer = 0;
        let vomitParticles = [];

        // Input Tracking
        const keys = { w: false, a: false, s: false, d: false, ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false };

        // UI Handles
        const titleScreen = document.getElementById('title-screen');
        const startBtn = document.getElementById('start-btn');
        const hud = document.getElementById('hud');
        const eatenCountEl = document.getElementById('eaten-count');
        const promptEl = document.getElementById('interaction-prompt');

        function initScene() {
            // Three.js Scene Setup
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x111827);

            // Camera Setup (Locked 3rd-Person Perspective)
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);

            // WebGL Renderer Setup
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            // Lighting Setup
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.65);
            scene.add(ambientLight);

            const ceilingLight = new THREE.DirectionalLight(0xfff7ed, 0.85);
            ceilingLight.position.set(2, 7, 3);
            ceilingLight.castShadow = true;
            ceilingLight.shadow.mapSize.width = 1024;
            ceilingLight.shadow.mapSize.height = 1024;
            ceilingLight.shadow.camera.near = 0.5;
            ceilingLight.shadow.camera.far = 15;
            ceilingLight.shadow.camera.left = -6;
            ceilingLight.shadow.camera.right = 6;
            ceilingLight.shadow.camera.top = 6;
            ceilingLight.shadow.camera.bottom = -6;
            scene.add(ceilingLight);

            buildKitchen();
            buildPlayer();
            
            window.addEventListener('resize', onWindowResize);
        }

        function buildKitchen() {
            // Tiled Floor
            const floorGeo = new THREE.PlaneGeometry(12, 12);
            const floorMat = new THREE.MeshStandardMaterial({ 
                color: 0xc8d0d8, 
                roughness: 0.3,
                metalness: 0.1
            });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);

            // Kitchen Walls
            const wallMat = new THREE.MeshStandardMaterial({ color: 0xe2e8f0, roughness: 0.8 });
            const wallHeight = 5;

            // Back Wall
            const backWall = new THREE.Mesh(new THREE.PlaneGeometry(12, wallHeight), wallMat);
            backWall.position.set(0, wallHeight / 2, -6);
            backWall.receiveShadow = true;
            scene.add(backWall);

            // Front Wall
            const frontWall = new THREE.Mesh(new THREE.PlaneGeometry(12, wallHeight), wallMat);
            frontWall.position.set(0, wallHeight / 2, 6);
            frontWall.rotation.y = Math.PI;
            scene.add(frontWall);

            // Left Wall
            const leftWall = new THREE.Mesh(new THREE.PlaneGeometry(12, wallHeight), wallMat);
            leftWall.position.set(-6, wallHeight / 2, 0);
            leftWall.rotation.y = Math.PI / 2;
            leftWall.receiveShadow = true;
            scene.add(leftWall);

            // Right Wall
            const rightWall = new THREE.Mesh(new THREE.PlaneGeometry(12, wallHeight), wallMat);
            rightWall.position.set(6, wallHeight / 2, 0);
            rightWall.rotation.y = -Math.PI / 2;
            rightWall.receiveShadow = true;
            scene.add(rightWall);

            // Center Wooden Table
            const tableGroup = new THREE.Group();
            const tableMat = new THREE.MeshStandardMaterial({ color: 0x5c3a21, roughness: 0.5 });
            
            // Table Top
            const topGeo = new THREE.BoxGeometry(2.6, 0.15, 2.6);
            const topMesh = new THREE.Mesh(topGeo, tableMat);
            topMesh.position.y = 1.1;
            topMesh.castShadow = true;
            topMesh.receiveShadow = true;
            tableGroup.add(topMesh);

            // Table Legs
            const legGeo = new THREE.CylinderGeometry(0.07, 0.07, 1.1, 16);
            const legPositions = [
                [-1.1, 0.55, -1.1],
                [1.1, 0.55, -1.1],
                [-1.1, 0.55, 1.1],
                [1.1, 0.55, 1.1]
            ];
            legPositions.forEach(pos => {
                const leg = new THREE.Mesh(legGeo, tableMat);
                leg.position.set(...pos);
                leg.castShadow = true;
                leg.receiveShadow = true;
                tableGroup.add(leg);
            });

            // White Plate on Table
            const plateGeo = new THREE.CylinderGeometry(0.65, 0.55, 0.04, 32);
            const plateMat = new THREE.MeshStandardMaterial({ color: 0xf8fafc, roughness: 0.2 });
            plateMesh = new THREE.Mesh(plateGeo, plateMat);
            plateMesh.position.set(0, 1.19, 0);
            plateMesh.castShadow = true;
            plateMesh.receiveShadow = true;
            tableGroup.add(plateMesh);

            // Chocolate Bar: Plain dark-brown rounded cylinder capsule lying flat on plate
            chocolateGroup = new THREE.Group();
            const chocMat = new THREE.MeshStandardMaterial({ 
                color: 0x2b1408, 
                roughness: 0.35,
                metalness: 0.05
            });

            const barCylinderGeo = new THREE.CylinderGeometry(0.12, 0.12, 0.6, 24);
            const barCylinder = new THREE.Mesh(barCylinderGeo, chocMat);
            barCylinder.rotation.z = Math.PI / 2; // Lie horizontal
            barCylinder.castShadow = true;
            barCylinder.receiveShadow = true;
            chocolateGroup.add(barCylinder);

            const capGeo = new THREE.SphereGeometry(0.12, 24, 24);
            const leftCap = new THREE.Mesh(capGeo, chocMat);
            leftCap.position.x = -0.3;
            leftCap.castShadow = true;
            leftCap.receiveShadow = true;
            chocolateGroup.add(leftCap);

            const rightCap = new THREE.Mesh(capGeo, chocMat);
            rightCap.position.x = 0.3;
            rightCap.castShadow = true;
            rightCap.receiveShadow = true;
            chocolateGroup.add(rightCap);

            chocolateGroup.position.set(0, 1.28, 0);
            tableGroup.add(chocolateGroup);

            scene.add(tableGroup);
        }

        function createFaceTexture() {
            faceCanvas = document.createElement('canvas');
            faceCanvas.width = 512;
            faceCanvas.height = 512;
            faceCtx = faceCanvas.getContext('2d');

            drawBaseFace();

            faceTexture = new THREE.CanvasTexture(faceCanvas);
            return faceTexture;
        }

        function drawBaseFace() {
            // Skin tone background
            faceCtx.fillStyle = '#e8b88a';
            faceCtx.fillRect(0, 0, 512, 512);

            // Expressive eyes
            faceCtx.fillStyle = '#1e293b';
            faceCtx.beginPath();
            faceCtx.arc(170, 220, 18, 0, Math.PI * 2);
            faceCtx.arc(342, 220, 18, 0, Math.PI * 2);
            faceCtx.fill();

            // Eyebrows
            faceCtx.strokeStyle = '#4a3b32';
            faceCtx.lineWidth = 10;
            faceCtx.lineCap = 'round';
            faceCtx.beginPath();
            faceCtx.moveTo(130, 185);
            faceCtx.lineTo(200, 195);
            faceCtx.moveTo(382, 185);
            faceCtx.lineTo(312, 195);
            faceCtx.stroke();

            // Nose
            faceCtx.strokeStyle = '#cd9869';
            faceCtx.lineWidth = 7;
            faceCtx.beginPath();
            faceCtx.moveTo(256, 215);
            faceCtx.lineTo(242, 275);
            faceCtx.lineTo(270, 275);
            faceCtx.stroke();

            // Anxious mouth line
            faceCtx.strokeStyle = '#99583b';
            faceCtx.lineWidth = 9;
            faceCtx.beginPath();
            faceCtx.arc(256, 365, 42, 0.1 * Math.PI, 0.9 * Math.PI);
            faceCtx.stroke();
        }

        function applyChocolateSmear() {
            const mouthX = 256;
            const mouthY = 360;

            for (let i = 0; i < 12; i++) {
                const angle = Math.random() * Math.PI * 2;
                const dist = Math.random() * 80;
                const x = mouthX + Math.cos(angle) * dist;
                const y = mouthY + Math.sin(angle) * dist * 0.7;
                const radius = 12 + Math.random() * 22;

                const colors = ['#2b1408', '#3d1d0c', '#1c0d05'];
                faceCtx.fillStyle = colors[Math.floor(Math.random() * colors.length)];
                faceCtx.beginPath();
                faceCtx.arc(x, y, radius, 0, Math.PI * 2);
                faceCtx.fill();
            }

            faceTexture.needsUpdate = true;
        }

        function cleanFace() {
            drawBaseFace();
            faceTexture.needsUpdate = true;
        }

        function buildPlayer() {
            playerGroup = new THREE.Group();
            torsoGroup = new THREE.Group();

            const skinMat = new THREE.MeshStandardMaterial({ color: 0xe8b88a, roughness: 0.7 });
            const shirtMat = new THREE.MeshStandardMaterial({ color: 0x3b82f6, roughness: 0.8 });
            const pantsMat = new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.9 });
            const hairMat = new THREE.MeshStandardMaterial({ color: 0x64748b, roughness: 0.9 });

            // Legs
            const legGeo = new THREE.BoxGeometry(0.22, 0.8, 0.22);
            const leftLeg = new THREE.Mesh(legGeo, pantsMat);
            leftLeg.position.set(-0.2, 0.4, 0);
            leftLeg.castShadow = true;
            playerGroup.add(leftLeg);

            const rightLeg = new THREE.Mesh(legGeo, pantsMat);
            rightLeg.position.set(0.2, 0.4, 0);
            rightLeg.castShadow = true;
            playerGroup.add(rightLeg);

            // Upper Body (Torso Group for tilting during vomit)
            torsoGroup.position.set(0, 0.8, 0);

            // Torso (Middle-aged build)
            const torsoGeo = new THREE.CylinderGeometry(0.42, 0.38, 0.9, 16);
            const torso = new THREE.Mesh(torsoGeo, shirtMat);
            torso.position.set(0, 0.45, 0);
            torso.castShadow = true;
            torsoGroup.add(torso);

            // Arms
            const armGeo = new THREE.CylinderGeometry(0.1, 0.1, 0.7, 12);
            const leftArm = new THREE.Mesh(armGeo, shirtMat);
            leftArm.position.set(-0.52, 0.5, 0);
            leftArm.rotation.z = 0.2;
            leftArm.castShadow = true;
            torsoGroup.add(leftArm);

            const rightArm = new THREE.Mesh(armGeo, shirtMat);
            rightArm.position.set(0.52, 0.5, 0);
            rightArm.rotation.z = -0.2;
            rightArm.castShadow = true;
            torsoGroup.add(rightArm);

            // Head Sphere with dynamic face texture
            const headGeo = new THREE.SphereGeometry(0.35, 32, 32);
            const headFaceTexture = createFaceTexture();
            const headMat = new THREE.MeshStandardMaterial({ 
                map: headFaceTexture, 
                roughness: 0.6 
            });

            headMesh = new THREE.Mesh(headGeo, headMat);
            headMesh.position.set(0, 1.25, 0);
            headMesh.rotation.y = -Math.PI / 2; // Face forward (+Z)
            headMesh.castShadow = true;
            torsoGroup.add(headMesh);

            // Hair Geometry: Horseshoe ring wrapping around lower back and sides only
            const hairGeo = new THREE.TorusGeometry(0.34, 0.05, 12, 24, Math.PI * 1.15);
            hairMesh = new THREE.Mesh(hairGeo, hairMat);
            hairMesh.rotation.x = Math.PI / 2;
            hairMesh.rotation.z = Math.PI * 0.925;
            hairMesh.position.set(0, 1.22, -0.02);
            hairMesh.castShadow = true;
            torsoGroup.add(hairMesh);

            playerGroup.add(torsoGroup);
            playerGroup.position.set(0, 0, 3.5);
            scene.add(playerGroup);
        }

        function setupEventListeners() {
            window.addEventListener('keydown', (e) => {
                if (e.key in keys) keys[e.key] = true;
                if (e.key === 'w' || e.key === 'W') keys.w = true;
                if (e.key === 'a' || e.key === 'A') keys.a = true;
                if (e.key === 's' || e.key === 'S') keys.s = true;
                if (e.key === 'd' || e.key === 'D') keys.d = true;

                // Eat Key Trigger
                if ((e.key === 'e' || e.key === 'E') && gameStarted && isNearTable && isChocolateAvailable && !isRegenerating) {
                    eatChocolateBar();
                }
            });

            window.addEventListener('keyup', (e) => {
                if (e.key in keys) keys[e.key] = false;
                if (e.key === 'w' || e.key === 'W') keys.w = false;
                if (e.key === 'a' || e.key === 'A') keys.a = false;
                if (e.key === 's' || e.key === 'S') keys.s = false;
                if (e.key === 'd' || e.key === 'D') keys.d = false;
            });

            startBtn.addEventListener('click', startGame);
        }

        function startGame() {
            titleScreen.classList.add('opacity-0');
            setTimeout(() => {
                titleScreen.classList.add('hidden');
                hud.classList.remove('hidden');
                gameStarted = true;
            }, 500);
        }

        function eatChocolateBar() {
            isChocolateAvailable = false;
            isRegenerating = true;
            chocolateGroup.visible = false;

            chocolateBarsEaten++;
            eatenCountEl.textContent = chocolateBarsEaten;

            // Vomit Mechanic Check (Triggers every 5 bars eaten)
            if (chocolateBarsEaten % 5 === 0) {
                // Immediately clean character's face
                cleanFace();
                // Trigger vomit animation and floor puddle
                triggerVomitSequence();
            } else {
                // Apply normal chocolate smear
                applyChocolateSmear();
            }

            promptEl.classList.add('opacity-0');

            // Regeneration Delay between 1 and 2 seconds
            const regenDelay = 1000 + Math.random() * 1000;
            setTimeout(() => {
                isChocolateAvailable = true;
                chocolateGroup.visible = true;
                isRegenerating = false;

                if (isNearTable) {
                    promptEl.classList.remove('opacity-0');
                }
            }, regenDelay);
        }

        function triggerVomitSequence() {
            isVomiting = true;
            vomitTimer = 0.8; // Duration of vomit tilt & spray

            // Calculate forward vector in front of player
            const forward = new THREE.Vector3(0, 0, 1).applyAxisAngle(new THREE.Vector3(0, 1, 0), playerGroup.rotation.y);
            const puddleX = playerGroup.position.x + forward.x * 0.75;
            const puddleZ = playerGroup.position.z + forward.z * 0.75;

            // Create flat brown splatter puddle on floor directly in front of player
            createVomitPuddle(puddleX, puddleZ);
        }

        function createVomitPuddle(x, z) {
            const puddleGroup = new THREE.Group();
            puddleGroup.position.set(x, 0.01, z);

            const mainMat = new THREE.MeshStandardMaterial({
                color: 0x3d1d0c,
                roughness: 0.3,
                metalness: 0.1
            });

            // Central main puddle blob
            const baseGeo = new THREE.CircleGeometry(0.35 + Math.random() * 0.12, 16);
            const baseMesh = new THREE.Mesh(baseGeo, mainMat);
            baseMesh.rotation.x = -Math.PI / 2;
            baseMesh.receiveShadow = true;
            puddleGroup.add(baseMesh);

            // Small splatters around main puddle
            for (let i = 0; i < 6; i++) {
                const radius = 0.08 + Math.random() * 0.1;
                const splatGeo = new THREE.CircleGeometry(radius, 12);
                const splatMesh = new THREE.Mesh(splatGeo, mainMat);
                splatMesh.rotation.x = -Math.PI / 2;

                const angle = Math.random() * Math.PI * 2;
                const dist = 0.2 + Math.random() * 0.25;
                splatMesh.position.set(Math.cos(angle) * dist, 0.001, Math.sin(angle) * dist);
                splatMesh.receiveShadow = true;
                puddleGroup.add(splatMesh);
            }

            scene.add(puddleGroup);
        }

        function spawnVomitParticles(origin, forwardDir) {
            const particleMat = new THREE.MeshBasicMaterial({ color: 0x3d1d0c });
            const particleGeo = new THREE.SphereGeometry(0.035, 8, 8);

            for (let i = 0; i < 3; i++) {
                const p = new THREE.Mesh(particleGeo, particleMat);
                p.position.copy(origin);

                const spreadDir = forwardDir.clone().add(new THREE.Vector3(
                    (Math.random() - 0.5) * 0.35,
                    (Math.random() - 0.5) * 0.2 - 0.2, // downward angle
                    (Math.random() - 0.5) * 0.35
                )).normalize();

                p.userData = {
                    velocity: spreadDir.multiplyScalar(2.2 + Math.random() * 1.2),
                    life: 0.5
                };

                scene.add(p);
                vomitParticles.push(p);
            }
        }

        function updateVomitParticles(delta) {
            for (let i = vomitParticles.length - 1; i >= 0; i--) {
                const p = vomitParticles[i];
                p.userData.life -= delta;
                p.userData.velocity.y -= 9.8 * delta; // Gravity
                p.position.addScaledVector(p.userData.velocity, delta);

                if (p.position.y <= 0.015 || p.userData.life <= 0) {
                    scene.remove(p);
                    p.geometry.dispose();
                    p.material.dispose();
                    vomitParticles.splice(i, 1);
                }
            }
        }

        function updatePlayer(delta) {
            if (!gameStarted) return;

            // Handle Vomit Animation State
            if (isVomiting) {
                vomitTimer -= delta;

                // Tilt torso forward during vomit
                torsoGroup.rotation.x = Math.sin((0.8 - vomitTimer) / 0.8 * Math.PI) * 0.4;

                // Emit particles towards floor
                const headWorldPos = new THREE.Vector3();
                headMesh.getWorldPosition(headWorldPos);
                const forward = new THREE.Vector3(0, 0, 1).applyAxisAngle(new THREE.Vector3(0, 1, 0), playerGroup.rotation.y);

                spawnVomitParticles(headWorldPos, forward);

                if (vomitTimer <= 0) {
                    isVomiting = false;
                    torsoGroup.rotation.x = 0;
                }
            }

            updateVomitParticles(delta);

            // Regular Player Movement Logic
            const moveSpeed = 3.6 * delta;
            let moveX = 0;
            let moveZ = 0;

            if (keys.w || keys.ArrowUp) moveZ -= 1;
            if (keys.s || keys.ArrowDown) moveZ += 1;
            if (keys.a || keys.ArrowLeft) moveX -= 1;
            if (keys.d || keys.ArrowRight) moveX += 1;

            if (moveX !== 0 || moveZ !== 0) {
                const length = Math.sqrt(moveX * moveX + moveZ * moveZ);
                moveX /= length;
                moveZ /= length;

                const newX = playerGroup.position.x + moveX * moveSpeed;
                const newZ = playerGroup.position.z + moveZ * moveSpeed;

                // Wall Collisions
                const clampedX = Math.max(-5.2, Math.min(5.2, newX));
                const clampedZ = Math.max(-5.2, Math.min(5.2, newZ));

                // Table Cylinder Collision
                const distToTable = Math.sqrt(clampedX * clampedX + clampedZ * clampedZ);
                if (distToTable > 1.4) {
                    playerGroup.position.x = clampedX;
                    playerGroup.position.z = clampedZ;
                } else {
                    const angle = Math.atan2(clampedZ, clampedX);
                    playerGroup.position.x = Math.cos(angle) * 1.41;
                    playerGroup.position.z = Math.sin(angle) * 1.41;
                }

                // Smooth rotation towards movement direction
                const targetAngle = Math.atan2(moveX, moveZ);
                playerGroup.rotation.y = targetAngle;
            }

            // Locked 3rd-person camera positioning
            const cameraOffset = new THREE.Vector3(0, 2.7, 4.0);
            camera.position.x = playerGroup.position.x + cameraOffset.x;
            camera.position.y = playerGroup.position.y + cameraOffset.y;
            camera.position.z = playerGroup.position.z + cameraOffset.z;
            camera.lookAt(playerGroup.position.x, playerGroup.position.y + 1.65, playerGroup.position.z);

            // Table Proximity Check
            const distanceToTable = Math.sqrt(playerGroup.position.x * playerGroup.position.x + playerGroup.position.z * playerGroup.position.z);
            isNearTable = distanceToTable < 2.2;

            if (isNearTable && isChocolateAvailable && !isRegenerating) {
                promptEl.classList.remove('hidden');
                promptEl.classList.remove('opacity-0');
            } else {
                promptEl.classList.add('opacity-0');
            }
        }

        let clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();
            updatePlayer(delta);

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // Window Load Entry Point
        window.onload = function() {
            initScene();
            setupEventListeners();
            animate();
        };
    </script>
</body>
</html>
